<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/calculadora.css}">
    <title>Calculadora</title>
</head>

<body>
    <div id="container">
        <h1>Calculadora</h1>
        <div class="box">
            <div class="binaria">
                <form th:action="@{/calculadora}" method="post">
                    <h2>Número 1:</h2>
                    <input type="number" id="num1" name="num1" step="any" required>
                    <h2>Número 2:</h2>
                    <input type="number" id="num2" name="num2" step="any" required>
                    <select name="operacao" id="operacao">
                        <option value="+">Soma</option>
                        <option value="-">Subtração</option>
                        <option value="*">Multiplicação</option>
                        <option value="/">Divisão</option>
                    </select>
                    <button type="submit">Calcular</button>
                </form>
            </div>
            <div class="resultado" th:if="${resultado}">
                <h2 th:text="${resultado}"></h2>
            </div>
        </div>

        <div class="box">
            <h2>Funções Unitárias</h2>
            <div class="unitaria">
                <form th:action="@{/calcular/unaria}" method="post">
                    <input type="number" name="num" placeholder="Digite um número" step="any" required>
                    <select name="operacao">
                        <option value="sqrt">Raiz Quadrada (√x)</option>
                        <option value="cbrt">Raiz Cúbica (³√x)</option>
                        <option value="pow10">Potência de 10 (10^x)</option>
                        <option value="factorial">Fatorial (x!)</option>
                        <option value="toBinary">Converter para Binário</option>
                    </select>
                    <button type="submit">Calcular</button>
                </form>
                <div class="resultado" th:if="${resultadoUnario}">
                    <h3 th:text="${resultadoUnario}"></h3>
                </div>
            </div>
        </div>

        <div class="box">
            <div class="constante">
                <form th:action="@{/calcular/constante}" method="post">
                    <input type="hidden" name="operacao" value="pi">
                    <button type="submit">Calcular Valor de PI (π)</button>
                </form>
                <div class="resultado" th:if="${resultadoConstante}">
                    <h3 th:text="${resultadoConstante}"></h3>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
